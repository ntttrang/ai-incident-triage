global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ai-incident-triage
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8085"]
        labels:
          service: ai-incident-triage

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
